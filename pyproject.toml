# ツールの設定だけを持つ（配布するパッケージではない）。依存は requirements-dev.txt。
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["e2e: calc-engine の MCP サーバ（jar）を起動する端から端までの試験"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 日本語の全角記号を docstring・コメントで使うため
ignore = ["RUF001", "RUF002", "RUF003"]
