name: hf-space

# 公開のデモサーバ（ADR-0013）を Hugging Face Spaces（Docker・無料の CPU）に送る。
# Space の中身は deploy/hf/（Dockerfile と Space の README）と、実行に要るディレクトリだけ。
# 要るもの：Secret HF_TOKEN（その Space への書き込み権限）、Variable HF_SPACE（例 user/echolab）。
# どちらかが無ければ、送るのを飛ばす。

on:
  push:
    branches: [main]
    paths:
      - "core/**"
      - "config/**"
      - "domains/**"
      - "servers/**"
      - "services/calc-engine/**"
      - "evals/redteam/screenshots/**"
      - "requirements.txt"
      - "deploy/hf/**"
      - ".github/workflows/hf-space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hf-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE: ${{ vars.HF_SPACE }}
    steps:
      - name: Skip when Hugging Face is not configured
        if: env.HF_TOKEN == '' || env.HF_SPACE == ''
        run: echo "::notice::HF_TOKEN（Secret）/ HF_SPACE（Variable）が未設定のため、送るのを飛ばしました（deploy/hf/README.md）"
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        with:
          python-version: "3.12"
      - name: Assemble the Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          mkdir -p space
          cp -r core config domains servers requirements.txt space/
          mkdir -p space/services space/evals/redteam
          cp -r services/calc-engine space/services/
          rm -rf space/services/calc-engine/build space/services/calc-engine/.gradle
          cp -r evals/redteam/screenshots space/evals/redteam/
          cp deploy/hf/Dockerfile space/Dockerfile
          cp deploy/hf/README.md space/README.md
          find space -name __pycache__ -prune -exec rm -rf {} +
      - name: Upload to the Space
        if: env.HF_TOKEN != '' && env.HF_SPACE != ''
        run: |
          pip install -q "huggingface_hub>=0.25"
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          space = os.environ["HF_SPACE"]
          api.create_repo(space, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(
              folder_path="space",
              repo_id=space,
              repo_type="space",
              commit_message=f"deploy {os.environ['GITHUB_SHA'][:7]}",
              delete_patterns="*",
          )
          print(f"https://huggingface.co/spaces/{space}")
          PY
