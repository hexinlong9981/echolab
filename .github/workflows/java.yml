name: java

on:
  push:
    branches: [main]
    paths:
      - "services/calc-engine/**"
      - "domains/wuwa/golden/**"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "services/calc-engine/**"
      - "domains/wuwa/golden/**"
      - ".github/workflows/java.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/calc-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, static analysis and coverage
        run: ./gradlew check --no-daemon
      - name: Upload coverage and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calc-engine-reports
          path: |
            services/calc-engine/build/reports/jacoco/test/
            services/calc-engine/build/reports/tests/test/
          retention-days: 14
