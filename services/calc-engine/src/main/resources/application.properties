# calc-engine の MCP サーバ（stdio）の設定（ADR-0008）。
# 標準出力は MCP のプロトコル専用。バナー・起動ログ・コンソールのログを標準出力に出してはいけない。
spring.main.web-application-type=none
spring.main.banner-mode=off
spring.main.log-startup-info=false

spring.ai.mcp.server.name=echolab-calc-engine
spring.ai.mcp.server.version=0.1.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.stdio=true
# ツールは McpToolConfiguration で明示的に登録する。注釈の走査と ToolCallback の変換は使わない
spring.ai.mcp.server.annotation-scanner.enabled=false
spring.ai.mcp.server.tool-callback-converter=false
# 公開するのはツールだけ（リソース・プロンプト・補完は持たない）
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false

logging.level.root=WARN
