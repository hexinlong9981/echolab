# ツールサービスの起動方法（ADR-0008）。domain.yaml の tools[].service から参照する。
# パスはリポジトリ直下からの相対パス。
# command の python は、コアを動かしているのと同じインタプリタで起動する（PATH は見ない）。
# env は既定値：同じ名前の環境変数がシェルにあれば、そちらが優先される
# （例：ECHOLAB_DATA_ROOT=/path/to/data python -m core.agent ...）。
schema_version: 1
services:
  calc-engine:
    transport: stdio
    command: ["java", "-jar", "services/calc-engine/build/libs/calc-engine-mcp.jar"]
    env:
      ECHOLAB_DATA_ROOT: domains
  mortgage-calc:
    # 住宅ローンのパックの計算（Python、ADR-0009）
    transport: stdio
    command: ["python", "-m", "domains.mortgage.calc"]
  vision-mcp:
    # スクリーンショットの OCR（Tesseract）。テンプレートは domains/*/vision（ADR-0010）
    transport: stdio
    command: ["python", "-m", "servers.vision_mcp"]
  mushoku-lore:
    # 無職転生のパックの検索・時系列・旅程（Python、ADR-0012）
    transport: stdio
    command: ["python", "-m", "domains.mushoku.service"]
