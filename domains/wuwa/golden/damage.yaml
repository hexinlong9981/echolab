# 期待ダメージのゴールデンケース。
# 入力はすべて明示した値で、ゲームの公式数値には依存しない（正しさを式だけで決めるため）。
# 期待値は tests/reference/calc_reference.py（Python）でも再計算して照合している。
schema_version: 1
tool: damage.expected
cases:
  - id: dmg-001
    description: 標準的なケース（会心率 60%・耐性 10%）
    derivation: hand
    input:
      atk: 2000
      skill_multiplier: 2.5
      dmg_bonus: 0.3
      crit_rate: 0.6
      crit_dmg: 2.2
      defense_constant: 1600
      enemy_def: 1000
      def_ignore: 0
      enemy_res: 0.1
      res_shred: 0
    expected:
      base: 5000.0
      bonus_multiplier: 1.3
      crit_multiplier: 1.72
      defense_multiplier: 0.615385
      resistance_multiplier: 0.9
      total: 6192.0
    tolerance: 1.0e-6
  - id: dmg-002
    description: 会心率が 100% を超える場合は 100% として扱う
    derivation: hand
    input:
      atk: 1500
      skill_multiplier: 1.8
      dmg_bonus: 0.5
      crit_rate: 1.2
      crit_dmg: 2.0
      defense_constant: 1600
      enemy_def: 1000
      def_ignore: 0.2
      enemy_res: 0.1
      res_shred: 0
    expected:
      base: 2700.0
      bonus_multiplier: 1.5
      crit_multiplier: 2.0
      defense_multiplier: 0.666667
      resistance_multiplier: 0.9
      total: 4860.0
    tolerance: 1.0e-6
  - id: dmg-003
    description: 耐性ダウンで有効耐性が負になる場合（1 − r/2）
    derivation: hand
    input:
      atk: 1800
      skill_multiplier: 3.0
      dmg_bonus: 0.2
      crit_rate: 0.5
      crit_dmg: 2.5
      defense_constant: 1600
      enemy_def: 1200
      def_ignore: 0
      enemy_res: 0.1
      res_shred: 0.3
    expected:
      base: 5400.0
      bonus_multiplier: 1.2
      crit_multiplier: 1.75
      defense_multiplier: 0.571429
      resistance_multiplier: 1.1
      total: 7128.0
    tolerance: 1.0e-6
  - id: dmg-004
    description: 防御無視 100%・補正なしでは基礎ダメージがそのまま残る
    derivation: hand
    input:
      atk: 1000
      skill_multiplier: 1.0
      dmg_bonus: 0
      crit_rate: 0
      crit_dmg: 1.5
      defense_constant: 1600
      enemy_def: 1000
      def_ignore: 1
      enemy_res: 0
      res_shred: 0
    expected:
      base: 1000.0
      bonus_multiplier: 1.0
      crit_multiplier: 1.0
      defense_multiplier: 1.0
      resistance_multiplier: 1.0
      total: 1000.0
    tolerance: 1.0e-6
