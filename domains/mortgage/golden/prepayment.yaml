# 一部繰上返済（元利均等返済の途中）のゴールデンケース。
# after_months 回の返済を終えた直後に prepay_amount を元金に充てる。
# 期間短縮型は最後の回に残りの元金と利息だけを払う。期待値は円未満を丸めない理論値。
schema_version: 1
tool: mortgage.prepayment
cases:
  - id: pre-001
    description: 金利 0・期間短縮型。残高 1,080,000 円から 120,000 円を返すと、毎月 10,000 円で 96 回（12 回短縮）
    derivation: hand
    input: {principal: 1200000, annual_rate: 0, years: 10, after_months: 12, prepay_amount: 120000, method: shorten_term}
    expected:
      balance_before: 1080000.0
      monthly_payment_after: 10000.0
      remaining_months_after: 96.0
      total_interest_before: 0.0
      total_interest_after: 0.0
      interest_saved: 0.0
      months_saved: 12.0
    tolerance: 1.0e-6
  - id: pre-002
    description: 金利 0・返済額軽減型。残り 960,000 円を 108 回で返すので毎月 8,888.888889 円
    derivation: hand
    input: {principal: 1200000, annual_rate: 0, years: 10, after_months: 12, prepay_amount: 120000, method: reduce_payment}
    expected:
      balance_before: 1080000.0
      monthly_payment_after: 8888.888889
      remaining_months_after: 108.0
      total_interest_before: 0.0
      total_interest_after: 0.0
      interest_saved: 0.0
      months_saved: 0.0
    tolerance: 1.0e-6
  - id: pre-003
    description: 3,000 万円・年 1.5%・35 年、5 年後に 300 万円を期間短縮型で返す
    derivation: reference
    input: {principal: 30000000, annual_rate: 0.015, years: 35, after_months: 60, prepay_amount: 3000000, method: shorten_term}
    expected:
      balance_before: 26615460.099989
      monthly_payment_after: 91855.331911
      remaining_months_after: 311.0
      total_interest_before: 8579239.402766
      total_interest_after: 7017193.925292
      interest_saved: 1562045.477475
      months_saved: 49.0
    tolerance: 1.0e-5
  - id: pre-004
    description: pre-003 と同じ条件を返済額軽減型で返す（期間は 360 回のまま）
    derivation: reference
    input: {principal: 30000000, annual_rate: 0.015, years: 35, after_months: 60, prepay_amount: 3000000, method: reduce_payment}
    expected:
      balance_before: 26615460.099989
      monthly_payment_after: 81501.725598
      remaining_months_after: 360.0
      total_interest_before: 8579239.402766
      total_interest_after: 7851941.129824
      interest_saved: 727298.272942
      months_saved: 0.0
    tolerance: 1.0e-5
